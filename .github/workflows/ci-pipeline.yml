name: Custos CI Pipeline
#The trigger (The "when")
on:
  push:
    branches:
      - 'main'
      - 'feature/*'
      - 'fix/*'
  pull_request:
    branches: [main]

  workflow_dispatch:



jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name : Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Run Unit Tests
        run: mvn clean test -DskipITs=true

  integration-test:
    needs: build-and-unit-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name : Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Integration Tests

        run: mvn verify -Dsurefire.skip=true -Dgpg.skip



